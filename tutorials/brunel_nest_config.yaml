# Brunel Balanced Random Network configuration for SuperNeuroABM GPU
# Kernel syntax follows masquelier_config.yaml format exactly
# All time parameters in SECONDS (dt in SI units)
# KEY ORDER matters: order of hyperparameters matches kernel read order

soma:
  brunel_nest_lif_soma:
    brunel_lif_neuron:
      hyperparameters:
        # All times in SECONDS; kernel reads in this order
        C_m: 250.0e-12         # 250 pF membrane capacitance (F) [optional: normalize to pF]
        tau_m: 0.020           # 20 ms membrane time constant (s)
        tau_syn_0: 0.0005     # 0.5 ms excitatory synaptic time constant (s)
        tau_syn_1: 0.0005     # 0.5 ms inhibitory synaptic time constant (s)
        V_th: 0.020            # 20 mV spike threshold (V)
        V_reset: 0.0           # 0 mV reset potential (V)
        E_L: 0.0               # 0 mV leak reversal potential (V)
        t_ref: 0.002           # 2 ms absolute refractory period (s)
        # J_ex: 0.0355e-12       # 0.0355 pA excitatory weight (A) [or use 20.68pA for alpha]
        # J_in: -0.1773e-12      # -0.1773 pA inhibitory weight (A), g=5 ratio
      internal_states:
        V_m: 0.0               # membrane potential (V), initialized to 0
        tcount: 0.0            # absolute time counter (s)
        tlast: -0.003          # time of last spike (s), initialized to negative
        I_syn_0: 0.0          # excitatory synaptic current (A)
        I_syn_1: 0.0          # inhibitory synaptic current (A)

synapse:
  brunel_nest_synapse:
    brunel_excitatory_synapse:
      hyperparameters:
        weight: 0.0355e-12     # 0.0355 pA excitatory connection weight (A)
        synaptic_delay: 0.0015 # 1.5 ms synaptic delay (s)
        channel: 0             # deliver to excitatory current channel
      internal_states:
        unused: 0.0            # placeholder state (kernel is event-driven, no internal state)

    brunel_inhibitory_synapse:
      hyperparameters:
        weight: -0.1773e-12    # -0.1773 pA inhibitory connection weight (A), g=5
        synaptic_delay: 0.0015 # 1.5 ms synaptic delay (s)
        channel: 1             # deliver to inhibitory current channel
      internal_states:
        unused: 0.0            # placeholder state (kernel is event-driven, no internal state)
