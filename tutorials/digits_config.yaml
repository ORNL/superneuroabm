# ==============================================================================
# SuperNeuroABM Tutorial 02: Handwritten Digits Classifier Configuration
# ==============================================================================
#
# Three top-level sections (soma / synapse / learning_rule), same schema as
# tutorial_00_config.yaml. Soma and synapse configs hold only `hyperparameters`
# and `internal_states`; learning rules live under `learning_rule:` and are
# attached to a synapse at create_synapse() time via
# learning_rule=/learning_rule_config=.
# ==============================================================================


# ==============================================================================
# SOMA CONFIGURATIONS
# ==============================================================================

soma:
  lif_soma:

    # Input layer LIF neurons (one per pixel)
    digits_input_config:
      hyperparameters:
        C: 1e-15 #10e-9
        R: 1e6
        vthr: -59.5
        tref: 1e-3
        vrest: -60
        vreset: -60
        tref_allows_integration: 0
        I_in: 0
        scaling_factor: 1e-5
      internal_states:
        v: -60.0
        tcount: 0.0
        tlast: 0.0

    # Output layer LIF neurons (one per class)
    digits_output_config:
      hyperparameters:
        C: 1e-15 #10e-9
        R: 1e6
        vthr: -59
        tref: 1e-3
        vrest: -60
        vreset: -60
        tref_allows_integration: 0
        I_in: 0
        scaling_factor: 1e-5
      internal_states:
        v: -60.0
        tcount: 0.0
        tlast: 0.0


# ==============================================================================
# SYNAPSE CONFIGURATIONS
# ==============================================================================

synapse:
  single_exp_synapse:

    # External -> input somas (no learning)
    digits_input_synapse_config:
      hyperparameters:
        weight: 1.0
        synaptic_delay: 1.0
        scale: 1.0
        tau_fall: 1e-3
        tau_rise: 0
      internal_states:
        I_synapse: 0.0

    # Input -> output somas (bounded STDP; learning rule attached at creation)
    digits_learning_synapse_config:
      hyperparameters:
        weight: 1.0
        synaptic_delay: 1.0
        scale: 1.0
        tau_fall: 1e-3
        tau_rise: 0
      internal_states:
        I_synapse: 0.0

    # External -> output somas (target/supervision spikes, no learning)
    digits_target_synapse_config:
      hyperparameters:
        weight: 1.0
        synaptic_delay: 1.0
        scale: 1.0
        tau_fall: 1e-3
        tau_rise: 0
      internal_states:
        I_synapse: 0.0


# ==============================================================================
# LEARNING RULE CONFIGURATIONS
# ==============================================================================
# Bounded exponential pair-wise STDP (stdp_type=2): hard-clamped to [wmin, wmax].
# LTD amplitude (a_exp_post) slightly exceeds LTP (a_exp_pre) so common pixels
# stay near zero while class-specific pixels accumulate net LTP.
# ==============================================================================

learning_rule:

  # Tutorial-owned rule, defined in user_customized_stdp.py and registered in the
  # notebook via model.register_learning_rule(). Currently a verbatim copy of the
  # built-in bounded rule below, so results are unchanged; edit the kernel to change
  # the learning behaviour.
  #
  # stdp_type MUST be the first key: learning_hyperparameters is packed positionally
  # in YAML key order, the generated selector dispatches on slot 0, and each rule
  # kernel reads its own parameters from slot 1 onward. -1.0 is only a placeholder
  # reserving that slot -- the real id is supplied at create_synapse() time from
  # register_learning_rule()'s return value, so this file never goes stale. If that
  # override is ever forgotten, -1.0 means "no rule" and learning is simply off,
  # which is visible in the weight matrix rather than silently wrong.
  user_customized_stdp:
    digits_learning:
      learning_hyperparameters:
        stdp_type: -1.0
        tau_pre_stdp: 4e-3
        tau_post_stdp: 4e-3
        a_exp_pre: 0.02
        a_exp_post: 0.05
        stdp_history_length: 1
        wmin: -100
        wmax: 100
      learning_internal_states:
        pre_trace: 0
        post_trace: 0
        dW: 0

  exp_pair_wise_stdp_bounded:
    digits_learning:
      learning_hyperparameters:
        stdp_type: 2.0
        tau_pre_stdp: 4e-3 #10e-3
        tau_post_stdp: 4e-3 #10e-3
        a_exp_pre: 0.02 #0.01
        a_exp_post: 0.05 #0.025
        stdp_history_length: 1
        wmin: -100
        wmax: 100
      learning_internal_states:
        pre_trace: 0
        post_trace: 0
        dW: 0
