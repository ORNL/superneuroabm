# ==============================================================================
# SuperNeuroABM Tutorial 01: Handwritten Digits Classifier Configuration
# ==============================================================================
#
# Three top-level sections (soma / synapse / learning_rule), same schema as the
# packaged superneuroabm/component_base_config.yaml that tutorial 00 runs on.
# Soma and synapse configs hold only `hyperparameters` and `internal_states`;
# learning rules live under `learning_rule:` and are attached to a synapse at
# create_synapse() time via learning_rule=/learning_rule_config=.
#
# Passing this file as user_config= REPLACES the packaged defaults -- it does not
# merge with them -- so every breed and config this notebook uses is declared here.
#
# The soma breed below is not a built-in: its kernel lives in
# user_customized_lif.py next to this file and is registered on the model at
# runtime. A custom soma needs a matching block here, keyed by the name passed
# to register_soma_type(). A custom learning rule does not -- see the
# `learning_rule:` section at the bottom.
# ==============================================================================


# ==============================================================================
# SOMA CONFIGURATIONS
# ==============================================================================

soma:
  # This key must equal the `name=` passed to model.register_soma_type().
  #
  # Key ORDER is index order -- the kernel reads neuron_params[i] positionally
  # and nothing validates soma configs, so a reordered block fails silently.
  user_customized_lif:

    # Input layer LIF neurons (one per pixel)
    digits_input_config:
      hyperparameters:
        C: 1e-9 #10e-9
        R: 1e6
        vthr: -59.5
        tref: 2e-3
        vrest: -60
        vreset: -60
        tref_allows_integration: 0
        I_in: 0
        scaling_factor: 1e-6
      internal_states:
        v: -60.0
        tcount: 0.0
        # -inf, not 0.0: the refractory test is (t - tlast) >= tref, so a finite
        # 0.0 would block the first 2 ticks of the run. user_customized_lif
        # handles the sentinel; the built-in lif_soma turns it into NaN on the
        # first spike and loses the refractory period thereafter.
        tlast: -.inf

    # Output layer LIF neurons (one per class)
    digits_output_config:
      hyperparameters:
        C: 1e-9 #10e-9
        R: 1e6
        vthr: -41
        tref: 2e-3
        vrest: -60
        vreset: -60
        tref_allows_integration: 0
        I_in: 0
        scaling_factor: 1e-6
      internal_states:
        v: -60.0
        tcount: 0.0
        tlast: -.inf


# ==============================================================================
# SYNAPSE CONFIGURATIONS
# ==============================================================================

synapse:
  single_exp_synapse:

    # External -> input somas (no learning)
    digits_input_synapse_config:
      hyperparameters:
        weight: 1.0
        synaptic_delay: 1.0
        scale: 1.0
        tau_fall: 1e-3
        tau_rise: 0
      internal_states:
        I_synapse: 0.0

    # Input -> output somas (bounded STDP; learning rule attached at creation)
    digits_learning_synapse_config:
      hyperparameters:
        weight: 1.0
        synaptic_delay: 1.0
        scale: 1.0
        tau_fall: 1e-3
        tau_rise: 0
      internal_states:
        I_synapse: 0.0

    # External -> output somas (target/supervision spikes, no learning)
    digits_target_synapse_config:
      hyperparameters:
        weight: 1.0
        synaptic_delay: 1.0
        scale: 1.0
        tau_fall: 1e-3
        tau_rise: 0
      internal_states:
        I_synapse: 0.0


# ==============================================================================
# LEARNING RULE CONFIGURATIONS
# ==============================================================================
# Bounded pair-wise STDP, hard-clamped to [wmin, wmax].
#
# Like the soma above, this block is named after the kernel that runs it --
# user_customized_stdp.py next to this file. The name is what create_synapse's
# learning_rule= argument looks up here; it is not what selects the kernel.
# ==============================================================================

learning_rule:
  user_customized_stdp:
    digits_learning:
      learning_hyperparameters:
        # Placeholder. stdp_type is what actually selects the kernel, and rule
        # ids are assigned at registration time, so the notebook overrides this
        # per synapse with the id register_learning_rule() returned. Never
        # hard-code the real id here.
        stdp_type: 2.0
        tau_pre_stdp: 3e-3 #10e-3
        tau_post_stdp: 2e-3 #10e-3
        a_exp_pre: 0.01 #0.01
        a_exp_post: 0.0 #0.025
        stdp_history_length: 1
        wmin: 0
        wmax: 1
      learning_internal_states:
        pre_trace: 0
        post_trace: 0
        dW: 0
