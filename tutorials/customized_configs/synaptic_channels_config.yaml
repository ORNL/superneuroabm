# Parameters for tutorial 06 (synaptic channels).
#
# A custom soma or synapse breed needs a config block, and a user_config replaces the
# packaged component_base_config.yaml instead of adding to it, so this file also carries
# the lif_soma and delivery_synapse blocks the notebook uses (copied from the packaged
# file). Breed keys must match the names the kernels are registered under in the
# notebook. Inside every block the KEY ORDER is the index order the kernel reads.

soma:
  lif_soma:
    config_0:
      hyperparameters:
        C: 10e-9  # Membrane capacitance in Farads (10 nF)
        R: 1e6  # Membrane resistance in Ohms (1 MΩ)
        vthr: -45  # Spike threshold voltage (mV)
        tref: 5e-3  # Refractory period (5 ms)
        vrest: -60  # Resting potential (mV)
        vreset: -60  # Reset potential after spike (mV)
        tref_allows_integration: 1  # Whether to allow integration during refractory period
        I_in: 0  # Constant input current
        scaling_factor: 1e-5  # Scaling factor for synaptic current
        tau_syn_0: 1e-2  # Channel 0 decay time constant (10 ms)
        tau_syn_1: 2e-3  # Channel 1 decay time constant (2 ms)
      internal_states:
        v: -60.0  # Initial membrane voltage
        tcount: 0.0  # Time counter
        tlast: 0.0  # Last spike time
        I_syn_0: 0.0  # Channel 0 synaptic current
        I_syn_1: 0.0  # Channel 1 synaptic current

  user_customized_conductance_lif:
    config_0:
      hyperparameters:
        C: 10e-9  # same membrane as lif_soma config_0
        R: 1e6
        vthr: -45
        tref: 5e-3
        vrest: -60
        vreset: -60
        tref_allows_integration: 1
        I_in: 0
        scaling_factor: 1e-5
        tau_syn_0: 1e-2  # channel 0: excitatory conductance, 10 ms
        tau_syn_1: 1e-2  # channel 1: inhibitory conductance, 10 ms
        E_rev_0: 0.0  # excitatory reversal potential (mV)
        E_rev_1: -80.0  # inhibitory reversal potential (mV)
      internal_states:
        v: -60.0
        tcount: 0.0
        tlast: 0.0
        I_syn_0: 0.0  # g_0, the channel-0 conductance
        I_syn_1: 0.0  # g_1, the channel-1 conductance

synapse:
  delivery_synapse:
    config_0:
      hyperparameters:
        weight: 14.0  # Synaptic weight (strength)
        synaptic_delay: 1.0  # pinned slot, unused (fixed one-tick delay)
        scale: 1.0  # Scaling factor
        channel: 0  # inbox slot = which tau_syn_<c> of the post soma applies
      internal_states:
        unused: 0.0

  user_customized_depressing_synapse:
    config_0:
      hyperparameters:
        weight: 14.0  # Synaptic weight (strength)
        synaptic_delay: 1.0  # pinned slot, unused (fixed one-tick delay)
        scale: 1.0  # multiplier on the delivered value
        channel: 0  # inbox slot of the post soma
        U: 0.5  # fraction of the available resources one spike uses
        tau_rec: 1e-1  # recovery time constant of the resources (100 ms)
      internal_states:
        x: 1.0  # available resources, 1 at rest
        last_tick: -1.0  # tick of the last delivered spike, -1 before the first
