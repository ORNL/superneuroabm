# Parameters for tutorial 02's "former synapse types" cell.
#
# A custom synapse breed needs a config block, and a user_config replaces the packaged
# component_base_config.yaml instead of adding to it, so this file also carries the
# lif_soma and delivery_synapse blocks that cell uses (copied from the packaged file).
# The breed key user_customized_double_exp_synapse must match the name it is registered
# under in the notebook. Inside every block the KEY ORDER is the index order the kernel
# reads (docs/CUSTOM_COMPONENTS.md).

soma:
  lif_soma:
    config_0:
      hyperparameters:
        C: 10e-9  # Membrane capacitance in Farads (10 nF)
        R: 1e6  # Membrane resistance in Ohms (1 TΩ)
        vthr: -45  # Spike threshold voltage (mV)
        tref: 5e-3  # Refractory period (5 ms)
        vrest: -60  # Resting potential (mV)
        vreset: -60  # Reset potential after spike (mV)
        tref_allows_integration: 1  # Whether to allow integration during refractory period
        I_in: 0  # Input current
        scaling_factor: 1e-5  # Scaling factor for synaptic current
        tau_syn_0: 1e-2  # Channel 0 synaptic current decay (s)
        tau_syn_1: 1e-2  # Channel 1
      internal_states:
        v: -60.0  # Initial membrane voltage
        tcount: 0.0  # Time counter
        tlast: 0.0  # Last spike time
        I_syn_0: 0.0  # Channel 0 synaptic current
        I_syn_1: 0.0  # Channel 1

synapse:
  delivery_synapse:
    config_0:
      hyperparameters:
        weight: 14.0  # Synaptic weight (strength)
        synaptic_delay: 1.0  # pinned slot, unused (fixed one-tick delay)
        scale: 1.0  # Scaling factor
        channel: 0  # inbox slot = which tau_syn_<c> of the post soma applies
      internal_states:
        unused: 0.0

  user_customized_double_exp_synapse:
    config_0:
      hyperparameters:
        weight: 14.0  # Synaptic weight (strength)
        synaptic_delay: 1.0  # pinned slot, unused (fixed one-tick delay)
        scale: 1.0  # multiplier; 1 / peak of the double exponential gives a peak of `weight`
        channel_decay: 0  # inbox slot whose tau_syn is the decay time constant (receives +q)
        channel_rise: 1  # inbox slot whose tau_syn is the rise time constant (receives -q)
      internal_states:
        unused: 0.0
