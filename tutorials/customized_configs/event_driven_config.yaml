# Parameters for tutorial 05 (event-driven vs clocked stepping).
#
# A user_config replaces the packaged component_base_config.yaml instead of adding to
# it, so this file carries every block the notebook uses: the built-in lif_soma,
# delivery_synapse and exp_pair_wise_stdp (copied from the packaged file), and three
# tutorial-owned kernels from customized_step_functions/ (breed keys = the names they
# are registered under in the notebook). Inside every block the KEY ORDER is the index
# order the kernel reads (docs/CUSTOM_COMPONENTS.md).

soma:
  lif_soma:
    config_0:
      hyperparameters:
        C: 10e-9  # Membrane capacitance in Farads (10 nF)
        R: 1e6  # Membrane resistance in Ohms (1 TΩ)
        vthr: -45  # Spike threshold voltage (mV)
        tref: 5e-3  # Refractory period (5 ms)
        vrest: -60  # Resting potential (mV)
        vreset: -60  # Reset potential after spike (mV)
        tref_allows_integration: 1  # Whether to allow integration during refractory period
        I_in: 0  # Input current
        scaling_factor: 1e-5  # Scaling factor for synaptic current
        tau_syn_0: 1e-2  # Channel 0 synaptic current decay (s)
        tau_syn_1: 1e-3  # Channel 1: tau_syn == dt, a one-tick pulse
      internal_states:
        v: -60.0  # Initial membrane voltage
        tcount: 0.0  # Time counter
        tlast: 0.0  # Last spike time
        I_syn_0: 0.0  # Channel 0 synaptic current
        I_syn_1: 0.0  # Channel 1

synapse:
  delivery_synapse:
    config_0:
      hyperparameters:
        weight: 14.0  # Synaptic weight (strength)
        synaptic_delay: 1.0  # pinned slot, unused (fixed one-tick delay)
        scale: 1.0  # Scaling factor
        channel: 0  # inbox slot = which tau_syn_<c> of the post soma applies
      internal_states:
        unused: 0.0
    recurrent:  # section 2's random network: neuron -> neuron
      hyperparameters:
        weight: 0.005
        synaptic_delay: 1.0
        scale: 1.0
        channel: 0  # tau_syn_0 = 10 ms
      internal_states:
        unused: 0.0
    external:  # section 2's random network: one input per neuron, fires it on its own
      hyperparameters:
        weight: 20.0
        synaptic_delay: 1.0
        scale: 1.0
        channel: 1  # tau_syn_1 = dt, a one-tick pulse
      internal_states:
        unused: 0.0

  # Tutorial 04's synapse: reads its pre soma's spike of the SAME tick (clocked only).
  user_customized_diehl_cook_synapse:
    config_0:
      hyperparameters:
        weight: 20.0  # pinned index 0
        synaptic_delay: 1.0  # pinned index 1, unused
        channel: 1  # the one-tick pulse channel
      internal_states:
        pre_arrived: 0.0

  # An electrical synapse: g * (v_pre - v_post) every tick (clocked only).
  user_customized_gap_junction:
    config_0:
      hyperparameters:
        weight: 0.1  # coupling conductance g: current per mV of voltage difference
        synaptic_delay: 1.0  # pinned slot, unused
        channel: 1  # the one-tick pulse channel (tau_syn == dt)
      internal_states:
        unused: 0.0

learning_rule:
  exp_pair_wise_stdp:
    default:
      learning_hyperparameters:
        stdp_type: 0.0   # Exp pair-wise STDP
        tau_pre_stdp: 10e-3  # Pre-synaptic STDP time constant (10 ms)
        tau_post_stdp: 10e-3  # Post-synaptic STDP time constant (10 ms)
        a_exp_pre: 0.005  # Pre-synaptic STDP learning rate
        a_exp_post: 0.005  # Post-synaptic STDP learning rate
        stdp_history_length: 100  # Length of STDP history buffer
      learning_internal_states:
        pre_trace: 0 # Pre-synaptic trace
        post_trace: 0 # Post-synaptic trace
        dW: 0 # Weight change accumulator
        last_tick: -1 # Tick the rule last ran (decay-on-wake); -1 = never

  # The built-in rule minus its catch-up: right only when stepped every tick.
  user_customized_naive_stdp:
    default:
      learning_hyperparameters:
        stdp_type: -1.0  # placeholder; overridden with the id register_learning_rule returns
        tau_pre_stdp: 10e-3
        tau_post_stdp: 10e-3
        a_exp_pre: 0.005
        a_exp_post: 0.005
        stdp_history_length: 100
      learning_internal_states:
        pre_trace: 0
        post_trace: 0
        dW: 0
        last_tick: -1
